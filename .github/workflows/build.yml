name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build portable wwr.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o wwr.exe .

      - name: Upload wwr.exe
        uses: actions/upload-artifact@v4
        with:
          name: wwr-windows-amd64
          path: wwr.exe
          if-no-files-found: error
