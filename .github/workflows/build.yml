name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build portable wwr.exe
        run: cargo build --release

      - name: Upload wwr.exe
        uses: actions/upload-artifact@v4
        with:
          name: wwr-windows-amd64
          path: target/release/wwr.exe
          if-no-files-found: error
