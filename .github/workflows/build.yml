name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build desktop app
        run: npx tauri build --no-bundle

      - name: Name portable exe
        shell: pwsh
        run: |
          Move-Item -Force `
            "src-tauri/target/release/wwr.exe" `
            "src-tauri/target/release/Windows Watermark Remover.exe"

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Watermark-Remover
          path: src-tauri/target/release/Windows Watermark Remover.exe
          if-no-files-found: error
