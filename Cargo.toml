[package]
name = "wwr"
version = "2.0.0"
edition = "2021"
description = "Silent Windows Insider evaluation watermark remover"
license = "MIT"
repository = "https://github.com/artechio/wwr"

[dependencies]
directories = "5.0.1"
pdb = "0.8.0"
sysinfo = "0.30.5"
ureq = { version = "2.9.4", default-features = false }

[dependencies.windows]
version = "0.54.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
